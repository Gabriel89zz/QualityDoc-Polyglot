server {
    listen 80;
    server_name localhost;

    # =======================================================
    # 🚀 SALVAVIDAS: Límite global de subida (35 MB)
    # Si no pones esto, Nginx bloqueará tus PDFs pesados
    # =======================================================
    client_max_body_size 35M;

    # --- AUDITORÍA (PHP Laravel) ---
    location / {
        root /var/www/html/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --- ADMINISTRADOR (.NET Core) ---
    location /admin/ {
        proxy_pass http://dotnet-app:8080/; 
        
        # 🚀 RECOMENDACIÓN OFICIAL DE MICROSOFT PARA KESTREL
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- BÚSQUEDA (FastAPI) ---
    location /api/search/ {
        proxy_pass http://python-app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}