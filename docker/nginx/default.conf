server {
    listen 80;
    # 🚀 Puedes poner aquí tu dominio o la IP de tu servidor Debian (ej. server_name 192.168.1.50;)
    server_name _;

    # =======================================================
    # 🛡️ 1. ENDURECIMIENTO DE SEGURIDAD (ISO 27001)
    # =======================================================
    server_tokens off; # Oculta la versión de Nginx a los atacantes

    # Evita que tu sitio sea embebido en un iFrame falso (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Bloquea ataques de Cross-Site Scripting (XSS)
    add_header X-XSS-Protection "1; mode=block" always;
    # Evita que el navegador adivine el tipo de archivo y ejecute virus
    add_header X-Content-Type-Options "nosniff" always;
    # Controla qué información se envía cuando haces clic en un link externo
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =======================================================
    # 🚀 2. OPTIMIZACIÓN DE CARGA PESADA
    # =======================================================
    client_max_body_size 35M; # Límite de subida de PDFs
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # --- AUDITORÍA (PHP Laravel) ---
    location / {
        root /var/www/html/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --- ADMINISTRADOR (.NET Core) ---
    location /admin/ {
        proxy_pass http://dotnet-app:8080/; 
        
        # 🚀 RECOMENDACIÓN OFICIAL DE MICROSOFT PARA KESTREL
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- BÚSQUEDA (FastAPI) ---
    location /api/search/ {
        proxy_pass http://python-app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}