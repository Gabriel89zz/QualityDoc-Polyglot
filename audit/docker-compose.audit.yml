version: '3.8'

services:
  postgres-db:
    image: postgres:15.6-alpine
    container_name: postgres_prod
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgresql/scripts:/docker-entrypoint-initdb.d
    networks:
      - quality-net

  php-app:
    build:
      context: ..
      dockerfile: audit/docker/php/Dockerfile
    container_name: php_laravel_prod
    restart: always
    env_file:
      - ../.env
    environment:
      - APP_NAME=QualityDoc
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://${IP_DEL_SERVIDOR_DEL_PROFE}:${APP_PORT:-80}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_prod
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - LOG_LEVEL=error
      - SESSION_DRIVER=database
      - SESSION_ENCRYPT=true
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - JWT_SECRET=${LARAVEL_JWT_SECRET}
      - PYTHON_API_URL=http://python_fastapi_prod:8000
      - CSHARP_API_URL=http://dotnet_mvc_prod:8080
    networks:
      - quality-net

networks:
  quality-net:
    external: true

volumes:
  postgres_data:
    name: postgres_data_prod