version: '3.8'

services:
  # --- PROXY INICIAL (La única puerta de entrada) ---
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx_gateway_prod
    restart: always
    ports:
      # El ":-80" es un salvavidas. Significa: "Usa APP_PORT, pero si a alguien se le 
      # olvida ponerlo en el .env, usa el 80 por defecto para que no explote".
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dotnet-app
      - php-app
      - python-app 
    networks:
      - quality-net

  # --- BASES DE DATOS (Blindadas, sin puertos expuestos al host) ---

  # ──────────────────────────────────────────────────────────
  # INIT: prepara el volumen con los permisos correctos (UID 10001)
  # ──────────────────────────────────────────────────────────
  sql-init:
    image: alpine:latest
    container_name: sql_server_init
    volumes:
      - sql_data:/data
    command: >
      sh -c "chown -R 10001:10001 /data && chmod 755 /data"
    networks:
      - quality-net
    restart: "no"

  
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    container_name: sql_server_prod
    restart: always
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SERVER_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql/data
      - ./db/sql-server/scripts:/usr/config/scripts:ro
      - ./db/sql-server/entrypoint.sh:/usr/config/entrypoint.sh:ro
    command: /bin/bash /usr/config/entrypoint.sh
    networks:
      - quality-net
    user: "10001:10001"

  postgres-db:
    image: postgres:15.6-alpine
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgresql/scripts:/docker-entrypoint-initdb.d
    networks:
      - quality-net

  mongo-db:
    image: mongo:4.4
    container_name: mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./db/mongodb/scripts:/docker-entrypoint-initdb.d
    networks:
      - quality-net

 # --- MICROSERVICIOS ---
  dotnet-app:
    build: 
      context: .
      dockerfile: docker/dotnet/Dockerfile
    container_name: dotnet_mvc_prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=QualityDocDB;User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Microservices__PythonSearchApi=http://python-app:8000
      - TZ=America/Monterrey
      - JwtConfig__SecretKey=${LARAVEL_JWT_SECRET}
      - EmailSettings__SenderEmail=${SMTP_EMAIL}
      - EmailSettings__Username=${SMTP_EMAIL}
      - EmailSettings__Password=${SMTP_PASSWORD}
    networks:
      - quality-net
    volumes:
      - doc_uploads:/app/wwwroot/uploads
      - crypto_keys:/app/keys

  php-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php_laravel_prod
    restart: always
    # 🚀 YA NO USAMOS VOLÚMENES NI ENV_FILE PARA LARAVEL
    # Inyectamos las variables directo en memoria mapeando desde el .env global
    environment:
      - APP_NAME=QualityDoc
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://${IP_DEL_SERVIDOR_DEL_PROFE}:${APP_PORT:-80}
      - APP_KEY=${LARAVEL_APP_KEY}
      
      # Base de Datos
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_prod
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB}       # 👈 Lo lee del global
      - DB_USERNAME=${POSTGRES_USER}     # 👈 Lo lee del global
      - DB_PASSWORD=${POSTGRES_PASSWORD} # 👈 Lo lee del global
      
      # Optimización y Seguridad
      - LOG_LEVEL=error
      - SESSION_DRIVER=database
      - SESSION_ENCRYPT=true
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      
      # Microservicios
      - JWT_SECRET=${LARAVEL_JWT_SECRET} # 👈 Lo lee del global
      - PYTHON_API_URL=http://python-app:8000
      - CSHARP_API_URL=http://dotnet-app:8080
    networks:
      - quality-net

  python-app:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: python_fastapi_prod
    restart: always
    environment: 
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - quality-net
      

networks:
  quality-net:
    driver: bridge

volumes:
  sql_data:
    name: sql_server_data
  postgres_data:
  mongo_data:
  doc_uploads:        
  crypto_keys: